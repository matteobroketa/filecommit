version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Europe/Zurich
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:20"
      timezone: Europe/Zurich
    groups:
      development-tooling:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
