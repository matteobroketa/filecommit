name: Extended validation

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  repeated-tests:
    name: Repeated tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install .
      - name: Repeat complete test suite
        run: python tools/repeat_tests.py --runs 15

  sustained-stress:
    name: Sustained stress (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run sustained concurrent replacement test
        run: >-
          python tools/stress_atomicity.py
          --writers 16
          --replacements 200
          --payload-size 131072

  reproducibility:
    name: Reproducible package content
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install build frontend
        run: python -m pip install build==1.5.0
      - name: Build first package set
        run: python -m build --outdir dist-first
      - name: Build second package set
        run: python -m build --outdir dist-second
      - name: Validate first package set
        run: >-
          python tools/validate_dist.py dist-first
          --compare-directory dist-second
