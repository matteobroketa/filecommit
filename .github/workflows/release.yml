name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Require an annotated tag on main
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = "tag"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Validate tag and release metadata
        id: release
        run: >-
          python tools/release_gate.py
          --tag "${{ github.ref_name }}"
          --notes RELEASE_NOTES.md
          --github-output "$GITHUB_OUTPUT"

  quality:
    name: Release quality
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install project quality tools
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint source and tests
        run: python -m ruff check .
      - name: Check static types
        run: python -m mypy
      - name: Enforce branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=95

  tests:
    name: Release tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  build:
    name: Build release artifacts
    needs: [gate, quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install build frontend
        run: python -m pip install build==1.5.0
      - name: Set reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build once from tagged source
        run: python -m build
      - name: Validate distribution contents and metadata
        run: python tools/validate_dist.py dist --write-checksums release/SHA256SUMS.txt
      - name: Install and exercise isolated wheel
        run: python tools/install_smoke.py dist
      - name: Rebuild from source archive
        run: >-
          python tools/rebuild_from_sdist.py dist
      - name: Produce release notes
        run: >-
          python tools/release_gate.py
          --tag "${{ github.ref_name }}"
          --notes release/RELEASE_NOTES.md
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            dist/
            release/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest release artifacts
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: artifact
      - name: Verify downloaded checksums
        working-directory: artifact/dist
        run: sha256sum --check ../release/SHA256SUMS.txt
      - name: Create GitHub artifact attestations
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifact/dist/*

  publish:
    name: Publish to PyPI
    needs: [gate, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/filecommit/${{ needs.gate.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: artifact
      - name: Verify downloaded checksums
        working-directory: artifact/dist
        run: sha256sum --check ../release/SHA256SUMS.txt
      - name: Publish validated distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: artifact/dist/
          skip-existing: ${{ github.run_attempt > 1 }}

  github-release:
    name: Publish GitHub release
    needs: [gate, build, attest, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: artifact
      - name: Verify downloaded checksums
        working-directory: artifact/dist
        run: sha256sum --check ../release/SHA256SUMS.txt
      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/dist/* artifact/release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              artifact/dist/* \
              artifact/release/SHA256SUMS.txt \
              --verify-tag \
              --title "filecommit ${{ needs.gate.outputs.version }}" \
              --notes-file artifact/release/RELEASE_NOTES.md
          fi
